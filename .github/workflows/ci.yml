name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alquileres
          POSTGRES_USER: alquileres
          POSTGRES_PASSWORD: alquileres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alquileres -d alquileres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://alquileres:alquileres@localhost:5432/alquileres?schema=public
      JWT_SECRET: ci-only-secret
      JWT_EXPIRES_IN: 15m
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:check
      - run: pnpm format:check
      - run: pnpm prisma:generate
      - run: pnpm --filter @alquileres/api prisma:deploy
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
