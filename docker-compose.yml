services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alquileres
      POSTGRES_USER: alquileres
      POSTGRES_PASSWORD: alquileres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alquileres -d alquileres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
